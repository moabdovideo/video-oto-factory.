name: OTOsLinks Automated Video Factory

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product Name (e.g. AI Secret Image Codebook)"
        required: true
        default: "AI Secret Image Codebook"
      main_result:
        description: "Main Result (what the product does)"
        required: false
        default: "generate studio-grade commercial graphics using secret style parameters"
      feature_1:
        description: "Feature 1"
        required: false
        default: "Secret Style Reference Matrix & Optical Camera Lighting Tokens"
      feature_2:
        description: "Feature 2"
        required: false
        default: "Multi-Scene Character Consistency Lock & Crisp Typography Syntax"
      feature_3:
        description: "Feature 3"
        required: false
        default: "Print-On-Demand Vector Isolation & Commercial Product Mockup Codes"
      bonus_value:
        description: "PrimeSite Bonus Vault Value Label"
        required: false
        default: "$24,000+"
      bonus_page_url:
        description: "Bonus Vault Page URL"
        required: false
        default: "https://otoslinks.com/vip-hot-bonuses-value-24k/"
      demo_url:
        description: "Demo Video URL (YouTube, Vimeo, Wistia, or direct .mp4)"
        required: false
        default: ""
      affiliate_link:
        description: "Your Review Page Link (where visitor reveals coupon)"
        required: false
        default: "https://otoslinks.com/"
      voice_name:
        description: "Natural AI Voice (auto-falls back to Ryan Studio HD if Edge is blocked)"
        required: false
        default: "en-US-GuyNeural"
      build_standalone_vault:
        description: "Also export standalone primesite_bonus_vault_promo.mp4 (false = TURBO)"
        required: false
        default: "false"

  repository_dispatch:
    types: [build_review_video]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Piper Studio Voice Engine (Turbo)
        uses: actions/cache@v4
        with:
          path: /tmp/piper_studio
          key: piper-studio-ryan-high-v1

      - name: Install FFmpeg, Studio Fonts & Audio Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libgomp1 fonts-dejavu-core fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Build v6.1 TURBO Faceless Video, Thumbnail & SEO Pack
        env:
          PRODUCT_NAME: ${{ inputs.product_name || github.event.client_payload.product_name || 'AI Secret Image Codebook' }}
          MAIN_RESULT: ${{ inputs.main_result || github.event.client_payload.main_result || 'generate studio-grade commercial graphics using secret style parameters' }}
          FEATURE_1: ${{ inputs.feature_1 || github.event.client_payload.feature_1 || 'Secret Style Reference Matrix & Optical Camera Lighting Tokens' }}
          FEATURE_2: ${{ inputs.feature_2 || github.event.client_payload.feature_2 || 'Multi-Scene Character Consistency Lock & Crisp Typography Syntax' }}
          FEATURE_3: ${{ inputs.feature_3 || github.event.client_payload.feature_3 || 'Print-On-Demand Vector Isolation & Commercial Product Mockup Codes' }}
          COUPON_CODE: ${{ github.event.client_payload.coupon_code || '' }}
          BONUS_VALUE: ${{ inputs.bonus_value || github.event.client_payload.bonus_value || '$24,000+' }}
          BONUS_PAGE_URL: ${{ inputs.bonus_page_url || github.event.client_payload.bonus_page_url || 'https://otoslinks.com/vip-hot-bonuses-value-24k/' }}
          DEMO_URL: ${{ inputs.demo_url || github.event.client_payload.demo_url || '' }}
          AFFILIATE_LINK: ${{ inputs.affiliate_link || github.event.client_payload.affiliate_link || 'https://otoslinks.com/' }}
          VOICE_NAME: ${{ inputs.voice_name || github.event.client_payload.voice_name || 'en-US-GuyNeural' }}
          BUILD_STANDALONE_VAULT: ${{ inputs.build_standalone_vault || github.event.client_payload.build_standalone_vault || 'false' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/build_video.py

      - name: Upload Ready Video Pack
        uses: actions/upload-artifact@v4
        with:
          name: review-output-pack
          path: review-output-pack/
          retention-days: 14
