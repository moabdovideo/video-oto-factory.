name: OTOsLinks Automated Video Factory

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product Name (leave default or edit for manual run)"
        required: true
        default: "AI Secret Image Codebook"
      main_result:
        description: "Main Result (what the product does)"
        required: false
        default: "generate studio-grade commercial graphics using secret style parameters"
      feature_1:
        description: "Feature 1"
        required: false
        default: "Secret Style Reference Matrix & Optical Camera Lighting Tokens"
      feature_2:
        description: "Feature 2"
        required: false
        default: "Multi-Scene Character Consistency Lock & Crisp Typography Syntax"
      feature_3:
        description: "Feature 3"
        required: false
        default: "Print-On-Demand Vector Isolation & Commercial Product Mockup Codes"
      demo_url:
        description: "Demo Video URL (YouTube, Vimeo, Wistia, or direct .mp4)"
        required: false
        default: ""
      affiliate_link:
        description: "Your Review Page Link (where visitor reveals coupon)"
        required: false
        default: "https://otoslinks.com/"
      bonus_value:
        description: "PrimeSite Bonus Vault Value Label"
        required: false
        default: "$24,000+"
      bonus_page_url:
        description: "Bonus Vault Page URL"
        required: false
        default: "https://otoslinks.com/vip-hot-bonuses-value-24k/"
      yt_privacy_status:
        description: "YouTube Upload Privacy (public / unlisted / private)"
        required: false
        default: "public"
      voice_name:
        description: "Natural AI Voice (auto-falls back to Ryan Studio HD if Edge is blocked)"
        required: false
        default: "en-US-GuyNeural"
      build_standalone_vault:
        description: "Also export standalone primesite_bonus_vault_promo.mp4 (false = TURBO)"
        required: false
        default: "false"

  repository_dispatch:
    types: [build_review_video]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Piper Studio Voice Engine (Turbo)
        uses: actions/cache@v4
        with:
          path: /tmp/piper_studio
          key: piper-studio-ryan-high-v1

      - name: Install FFmpeg, Studio Fonts & Audio Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libgomp1 fonts-dejavu-core fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Step 1 - Smart Extract Article Specs & Demo URL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/extract_article_data.py

      - name: Step 2 - Build v7.2 TURBO Faceless Video, Thumbnail & SEO Pack
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          python scripts/build_video.py

      - name: Step 3 - Auto-Publish Directly to YouTube Channel
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ secrets.YT_PLAYLIST_ID }}
          CALLBACK_WEBHOOK_URL: ${{ secrets.CALLBACK_WEBHOOK_URL }}
        run: |
          python scripts/upload_to_youtube.py

      - name: Step 4 - Upload Backup Video Pack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-output-pack
          path: review-output-pack/
          retention-days: 14
